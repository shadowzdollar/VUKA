<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 974" preserveAspectRatio="xMidYMin slice" role="img" aria-label="Cross-border payment between Rwanda and Kenya" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f6f7"/>
      <stop offset="0.5" stop-color="#cfd1d5"/>
      <stop offset="1" stop-color="#9b9ea4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7bd"/>
      <stop offset="0.55" stop-color="#d2b676"/>
      <stop offset="1" stop-color="#a8864a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <g id="coin">
      <rect x="-80" y="0" width="160" height="16" fill="#a8864a"/>
      <ellipse cx="0" cy="16" rx="80" ry="26" fill="#a8864a"/>
      <ellipse cx="0" cy="0" rx="80" ry="26" fill="url(#gold)"/>
      <ellipse cx="0" cy="0" rx="58" ry="18" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2"/>
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
  </defs>

  <!-- silk backdrop -->
  <rect width="860" height="974" fill="url(#bg)"/>
  <g filter="url(#soft)" fill="none" stroke-linecap="round">
    <path d="M-60 180 C 200 60, 380 360, 620 240 S 900 120, 940 220" stroke="#fff" stroke-opacity="0.75" stroke-width="64"/>
    <path d="M-80 420 C 160 300, 340 600, 600 470 S 880 380, 940 460" stroke="#6f7278" stroke-opacity="0.45" stroke-width="56"/>
    <path d="M-60 700 C 220 560, 420 860, 700 700 S 900 640, 960 700" stroke="#fff" stroke-opacity="0.7" stroke-width="70"/>
    <path d="M-40 900 C 240 800, 460 1000, 760 880" stroke="#5b5e64" stroke-opacity="0.4" stroke-width="60"/>
  </g>

  <!-- cross-border route: RW to KE -->
  <path d="M170 215 Q 430 20 690 215" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-weight="700" font-size="22" text-anchor="middle">
    <circle cx="140" cy="235" r="38" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="140" y="243" fill="#111">RW</text>
    <circle cx="720" cy="235" r="38" fill="#111"/>
    <text x="720" y="243" fill="#fff">KE</text>
  </g>

  <!-- back card (gold) -->
  <g transform="translate(470 500) rotate(9)" filter="url(#shadow)">
    <rect x="-260" y="-160" width="520" height="320" rx="30" fill="url(#gold)"/>
    <path d="M-260 -40 C -100 -120, 100 40, 260 -50 L260 -130 a30 30 0 0 0 -30 -30 L-230 -160 a30 30 0 0 0 -30 30 z" fill="#fff" fill-opacity="0.22"/>
  </g>

  <!-- front card (dark) -->
  <g transform="translate(410 470) rotate(-13)" filter="url(#shadow)">
    <rect x="-260" y="-160" width="520" height="320" rx="30" fill="url(#card)"/>
    <path d="M-260 -30 C -90 -130, 120 30, 260 -60 L260 -130 a30 30 0 0 0 -30 -30 L-230 -160 a30 30 0 0 0 -30 30 z" fill="#fff" fill-opacity="0.07"/>
    <!-- chip -->
    <rect x="-215" y="-85" width="72" height="54" rx="10" fill="url(#gold)"/>
    <path d="M-215 -58 H-143 M-179 -85 V-31" stroke="#8a6d36" stroke-width="2" fill="none"/>
    <!-- contactless -->
    <g fill="none" stroke="#d9d9dc" stroke-width="5" stroke-linecap="round" transform="translate(-95 -58)">
      <path d="M0 -14 a20 20 0 0 1 0 28"/>
      <path d="M12 -24 a34 34 0 0 1 0 48"/>
      <path d="M24 -34 a48 48 0 0 1 0 68"/>
    </g>
    <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#fff">
      <text x="-215" y="40" font-size="28" letter-spacing="5" fill="#cfcfd3">•••• •••• •••• 2026</text>
      <text x="-215" y="112" font-size="34" font-weight="700" letter-spacing="3">VUKA</text>
    </g>
    <circle cx="168" cy="100" r="30" fill="#d2b676" fill-opacity="0.95"/>
    <circle cx="198" cy="100" r="30" fill="#fff" fill-opacity="0.6"/>
  </g>

  <!-- coins -->
  <g>
    <use href="#coin" x="700" y="790"/>
    <use href="#coin" x="700" y="766"/>
    <use href="#coin" x="700" y="742"/>
    <use href="#coin" x="700" y="718"/>
    <g transform="translate(150 850) scale(0.7)">
      <use href="#coin" x="0" y="0"/>
      <use href="#coin" x="0" y="-24"/>
      <use href="#coin" x="0" y="-48"/>
    </g>
  </g>
</svg>
